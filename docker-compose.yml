version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: writegen_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'

  backend:
    build: ./backend
    container_name: writegen_backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/writegen_ai
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: 7d
      USE_MOCK_AI: ${USE_MOCK_AI:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID:-}
      FRONTEND_URL: http://localhost:4200
      FREE_DAILY_CREDITS: 10
      PREMIUM_DAILY_CREDITS: 100
    ports:
      - '5000:5000'

  frontend:
    build: ./frontend
    container_name: writegen_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '4200:80'

volumes:
  mongo_data:
