services:
  - type: web
    name: writegen-ai-backend
    env: node
    region: oregon # or frankfurt, ohio, singapore
    buildCommand: npm install
    startCommand: npm run start # Make sure you have a start script in package.json, e.g., "start": "node src/server.js"
    
    # Environment Variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
        
      # Database (Managed in Render Dashboard)
      - key: MONGO_URI
        sync: false
        
      # Auth (Managed in Render Dashboard)
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d

      # Groq AI Keys (Managed in Render Dashboard)
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile

      # AI Behaviour 
      - key: USE_MOCK_AI
        value: false
      - key: USE_FALLBACK_ONLY
        value: false
      - key: AI_TIMEOUT_MS
        value: 15000
      - key: AI_MAX_RETRIES
        value: 2

      # Feature Flags
      - key: ENABLE_FALLBACK
        value: true
      - key: ENABLE_AB_TESTING
        value: true
      - key: ENABLE_CACHING
        value: true

      # Frontend Connection (Managed in Render Dashboard)
      - key: FRONTEND_URL
        sync: false
